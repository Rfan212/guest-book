<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guest Book</title>

    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <!-- Link Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Link Javascript -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar sm:navbar-expand bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand fs-3 fw-bold" href="#home">Guest Book</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#home">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contact">About Us</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <!-- Form -->
    <main>
      <div class="container" id="home">
        <div class="row">
          <div class="col-6 md:col-4">
            <form id="projectForm">
              <div class="card">
                <h5 class="card-header bg-primary fg-white">Leave Messege</h5>
                <div class="card-body">
                  <div class="form-field">
                    <label for="fieldText" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="projectName" placeholder="Enter your full name" />
                  </div>
                  <div class="form-field">
                    <label for="fieldTextarea" class="form-label">Message</label>
                    <textarea class="form-control" id="fieldTextarea" rows="4" placeholder="Write your messege hire"></textarea>
                  </div>
                  <button class="btn btn-solid theme-primary w-100" type="submit" id="button">Submit</button>
                </div>
              </div>
            </form>
          </div>
          <div class="md:col-8">
            <div class="card main-card">
              <h5 class="card-header">New Messages</h5>
              <div class="card-body" id="projectList"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black fg-white">
      <div class="container text-center">
        <p class="fw-bold pt-5">Connect with Us</p>
        <div class="d-flex gap-5 justify-content-center mb-4" id="contact">
          <a href="#"><i data-feather="linkedin"></i></a>
          <a href="#"><i data-feather="facebook"></i></a>
          <a href="#"><i data-feather="instagram"></i></a>
          <a href=""><i data-feather="github"></i></a>
        </div>
        <p class="mb-0 pb-2">&copy; Interactive Guest Book. All rights reserved.</p>
      </div>
    </footer>

    <!-- Feather Icons -->
    <script>
      feather.replace();
    </script>
  </body>
</html>
